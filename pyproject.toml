[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "text-to-speech-cli"
version = "1.0.0"
description = "Cross-platform command-line text-to-speech tool using native OS engines"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Text-to-Speech Maintainers" }
]
keywords = ["tts", "text-to-speech", "cli", "audio"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
]

[project.urls]
Homepage = "https://example.com/text-to-speech"
Repository = "https://example.com/text-to-speech.git"

[project.scripts]
tts = "tts:main"

[tool.setuptools]
py-modules = ["tts"]
